<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Link to external Javascrip file-->
    <title>Student Grade Tracker Assignment</title>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="form-content">
        <h1>DSS Student Grade Tracker</h1>
        <!--Form Section goes here-->
        <div class="input-content">
            <input type="text" id="student-name" placeholder="Enter student Name" />
            <input type="number" id="student-grade" placeholder="Enter Grade (0-100)" />
            <button id="add-student">Add Student</button>
            <!--Error Message Section-->
            <div>
                <p id="error-message"></p>

                <!--Student List Section-->
                <h2>Student List</h2>
                <ul id="student-list"></ul>

                <!--average Grade Section-->
                <h2>Average Grade: <span id="average-grade">0</span></h2>

            </div>
</body>

</html>
